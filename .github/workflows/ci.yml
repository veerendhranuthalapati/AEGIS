name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege by default; no job needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  # Ephemeral CI-only values — never use in production.
  CI_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
  CI_SECRET_KEY: ci-test-secret-key-not-for-production
  CI_UPSTREAM_URL: http://127.0.0.1:8100

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      SECRET_KEY: ${{ env.CI_SECRET_KEY }}
      UPSTREAM_BASE_URL: ${{ env.CI_UPSTREAM_URL }}
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app --config-file mypy.ini

      - name: Migrate database
        run: alembic upgrade head

      - name: Pytest
        run: pytest tests -q

      - name: pip-audit (runtime dependencies)
        run: pip-audit -r requirements.txt --desc on

  frontend:
    name: Frontend (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  docker:
    name: Docker (build, scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t aegis-backend:ci ./backend

      - name: Docker Scout (high/critical, informational)
        continue-on-error: true
        run: |
          docker scout cves aegis-backend:ci --only-severity high,critical \
            || echo "Docker Scout scan completed with findings (non-blocking)"

  attack-lab:
    name: Attack lab (16 scenarios)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      SECRET_KEY: ${{ env.CI_SECRET_KEY }}
      UPSTREAM_BASE_URL: ${{ env.CI_UPSTREAM_URL }}
      ENVIRONMENT: test
      AEGIS_IN_PROCESS_WORKER: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend + mock-api dependencies
        run: |
          pip install -r requirements.txt
          pip install fastapi uvicorn pydantic httpx

      - name: Bootstrap database and demo users
        run: |
          alembic upgrade head
          python -m app.scripts.seed

      - name: Start mock upstream and gateway
        run: |
          cd ../attack_lab/targets/mock_api
          uvicorn main:app --host 127.0.0.1 --port 8100 &
          cd -
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8100/health && curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8100/health
          curl -sf http://127.0.0.1:8000/health

      - name: Run attack lab
        run: python ../attack_lab/scripts/run_all.py

      - name: Run bypass regression suite
        working-directory: attack_lab/bypass_tests
        run: python run_bypass.py http://127.0.0.1:8000

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets

      - name: Bandit (HIGH severity and above)
        working-directory: backend
        run: bandit -r app -lll -q

      - name: detect-secrets (baseline)
        run: |
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '\.lock$|node_modules|\.venv|dist/|\.secrets\.baseline'
